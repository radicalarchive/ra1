<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Radical Aces</title>
<link rel="icon" href="./graphics/icon.png">
<style>
  /* The game is a fixed 500x360 offscreen image blitted by F51.paint(). The
     page scales that up with nearest-neighbour so the chunky 2001 look
     survives; the canvas backing store stays 500x360 so every coordinate in
     the transpiled code means exactly what it meant in Java. */
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    color: #aeb9c6;
    font: 13px/1.4 sans-serif;
    overflow: hidden;
  }
  #wrap {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    width: min(100vw, calc(100vh * 500 / 360));
    height: auto;
    aspect-ratio: 500 / 360;
    image-rendering: pixelated;
    background: #000;
    /* The game takes every arrow key and TAB; keep the browser out of it. */
    touch-action: none;
    outline: none;
  }
  #gesture {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, .82);
    cursor: pointer;
    z-index: 2;
  }
  #gesture p { text-align: center; letter-spacing: .04em; }
  /* The game's own icon, at 2x its 48px so it is not a smudge on a hidpi
     screen; nearest-neighbour to keep the 2001 pixels. */
  #brand {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  #brand img {
    width: 96px;
    height: 96px;
    image-rendering: pixelated;
  }
  #brand h1 {
    margin: 0;
    font-size: 30px;
    font-weight: 600;
    letter-spacing: .10em;
    color: #dbe4ef;
  }
  #brand .sub {
    margin: 4px 0 0;
    font-size: 12px;
    letter-spacing: .04em;
    color: #6f7c8a;
  }
  #gesture .panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }
  #opts {
    display: flex;
    flex-direction: column;
    gap: 8px;
    font-size: 12px;
    color: #8c99a8;
  }
  #opts label {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    /* The panel itself is the click target that starts the game; a click on a
       checkbox must not also start it. */
  }
  #opts .hint { color: #5d6874; }
  #play {
    letter-spacing: .04em;
    border: 1px solid #4a5560;
    background: #12171c;
    color: #aeb9c6;
    padding: 10px 26px;
    font: inherit;
    cursor: pointer;
  }
  #play:hover { background: #1b232a; }
  #error {
    position: fixed;
    inset: auto 0 0 0;
    padding: 8px 12px;
    background: #400;
    color: #fdd;
    font-family: monospace;
    white-space: pre-wrap;
    display: none;
    z-index: 3;
  }
</style>
</head>
<body>
<div id="loading" style="display: none; position: fixed; top: 40vh; left: 50vh;">Loading...</div>
<div id="wrap">
  <canvas id="screen" width="500" height="360" tabindex="0"></canvas>
</div>


<!-- Browsers refuse to start audio without a user gesture, and this game
     opens on a music track, so the first click both unlocks the AudioContext
     and gives the canvas keyboard focus. -->
<div id="gesture">
  <div class="panel">
    <div id="brand">
      <img src="./graphics/icon.png" alt="">
      <div>
        <h1>RADICAL ACES</h1>
        <p class="sub">Omar Waly, 2001 &mdash; ported to the browser</p>
      </div>
    </div>
    <div id="opts">
      <label>
        <input type="checkbox" id="opt-res">
        2&times; resolution
        <span class="hint">&mdash; crisper polygons and text</span>
      </label>
      <label>
        <input type="checkbox" id="opt-smooth">
        Smooth motion
        <span class="hint">&mdash; interpolated frames, same game speed</span>
      </label>
    </div>
    <button id="play">click to play</button>
  </div>
</div>


<div id="error"></div>

<script type="module">
  import { boot } from './web/main.js';

  const canvas = document.getElementById('screen');
  const gesture = document.getElementById('gesture');
  const loading = document.getElementById('loading');
  const errbox = document.getElementById('error');

  function fail(e) {
    errbox.style.display = 'block';
    errbox.textContent = String(e && e.stack ? e.stack : e);
    console.error(e);
  }
  window.addEventListener('error', (e) => fail(e.error || e.message));
  window.addEventListener('unhandledrejection', (e) => fail(e.reason));

  // Options are remembered between sessions, and readable from the URL so a
  // bug report can pin them: ?res=2&smooth=1.
  const params = new URLSearchParams(location.search);
  const stored = (k, d) => {
    if (params.has(k)) return params.get(k) === '1' || params.get(k) === '2';
    const v = localStorage.getItem('ra1:' + k);
    return v === null ? d : v === '1';
  };
  const optRes = document.getElementById('opt-res');
  const optSmooth = document.getElementById('opt-smooth');
  optRes.checked = stored('res', false);
  optSmooth.checked = stored('smooth', true);

  document.getElementById('play').addEventListener('click', async () => {
    localStorage.setItem('ra1:res', optRes.checked ? '1' : '0');
    localStorage.setItem('ra1:smooth', optSmooth.checked ? '1' : '0');
    const opts = { scale: optRes.checked ? 2 : 1, smooth: optSmooth.checked };
    gesture.remove();
    loading.style.display = 'block'
    canvas.focus();

    try {
      await boot(canvas, opts);
      loading.style.display = 'none'
    } catch (e) {
      fail(e);
    }
  }, { once: true });
</script>
</body>
</html>
